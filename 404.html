<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | STACKLY</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .bg-404 {
            position: absolute;
            font-size: 40vw;
            font-weight: 700;
            color: rgba(247, 245, 239, 0.03);
            z-index: 0;
            line-height: 1;
            font-family: var(--font-heading);
            user-select: none;
        }
        
        .content-404 {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
        }
        
        .content-404 h1 {
            font-size: 64px;
            margin-bottom: 24px;
            color: var(--accent-color);
            /* GSAP animation target */
            clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
            opacity: 0;
            transform: translateY(50px);
        }
        
        .content-404 p {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .btns-404 {
            display: flex;
            gap: 16px;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .top-brand {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
        }
        .top-brand img {
            height: 40px;
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>

    <div class="top-brand" id="brand404">
        <a href="index.html"><img src="assets/Brand-logo.webp" alt="STACKLY"></a>
    </div>

    <div class="bg-404" id="bg404">404</div>
    
    <div class="content-404">
        <h1 id="title404">Market Disconnected</h1>
        <p id="desc404">The page you are looking for has been moved, removed, or never existed in this portfolio.</p>
        
        <div class="btns-404" id="btns404">
            <button onclick="window.history.back()" class="btn btn-outline" style="border-color: var(--secondary-color); color: var(--secondary-color);"><i class="fas fa-arrow-left mr-2"></i> Go Back</button>
            <a href="index.html" class="btn btn-gold">Back to Home</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof gsap !== 'undefined') {
                const tl = gsap.timeline();
                
                tl.to('#brand404', { opacity: 1, duration: 1 })
                  .to('#title404', { opacity: 1, y: 0, clipPath: 'polygon(0 0, 100% 0, 100% 100%, 0 100%)', duration: 0.8, ease: 'power3.out' }, "-=0.5")
                  .to('#desc404', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, "-=0.4")
                  .to('#btns404', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, "-=0.4");
                  
                gsap.to('#bg404', {
                    y: 20,
                    duration: 4,
                    repeat: -1,
                    yoyo: true,
                    ease: 'sine.inOut'
                });
            }
        });
    </script>
</body>
</html>
